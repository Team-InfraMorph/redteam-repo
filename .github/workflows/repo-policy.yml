name: Repository policy

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repo-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-policy:
    name: repo-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test policy validator
        run: |
          python3 -m unittest discover -s tests -p 'test_repo_policy.py' -v
          python3 -m unittest discover -s tests -p 'test_issue_policy.py' -v
      - name: Validate branch and actual PR body
        run: python3 scripts/repo_policy.py --event "$GITHUB_EVENT_PATH"
      - name: Set up Node for syntax-only fixture checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate redteam fixture corpus (no production Gate execution)
        run: python3 -m unittest discover -s tests -p 'test_fixtures.py' -v
